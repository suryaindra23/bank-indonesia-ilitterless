<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#0B2D6B">
<title>COBI | Aplikasi Warga</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/src/styles.css">


</head>
<body class="resident-app" data-api-role="peserta">
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs id="bdefs"></defs></svg>

<header class="resident-header">
  <a class="resident-brand" href="/warga/" aria-label="Beranda COBI"><img src="/brand/ilitterless-symbol.png" width="52" height="52" alt="Ikon paus iLitterless"><div class="brand-wordmark"><strong>COBI</strong><small>Community Base Of iLitterless Indonesia</small></div></a>
  <div id="accountMenu" class="account-menu" hidden></div>
</header>
<main id="v-peserta">
  <div class="stage">
    <aside class="desktop-welcome">
      <span class="logo">Bersama COBI</span>
      <h1>Aksi kecil untuk bumi.<br>Mulai dari keseharianmu.</h1>
      <p>Catat aksi baik, belajar mengurangi sampah, dan tumbuh bersama Bibu.</p>
      <div id="desktop-bibu" aria-hidden="true"></div>
      <p class="s">Program iLitterless Indonesia untuk warga Lowokwaru, Malang.</p>
    </aside>
    <div class="phone noauth" id="phone" aria-label="Aplikasi warga COBI"><div class="scr" id="scr"></div><nav class="tabbar" id="tabbar" aria-label="Menu utama"></nav><div id="net" role="status"></div><div id="sheet"></div><div id="wa"></div></div>

  </div>
</main>


<div class="toast" id="toast" role="status"></div>


<script type="module" src="/src/main.js"></script>
</body>
</html>
